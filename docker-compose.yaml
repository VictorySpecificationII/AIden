version: "3"
services:
      
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    networks:
      - dev
    ports:
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
      - "8889:8889"     # Prometheus metrics exporter

    volumes:
      - ./tools/sre/opentelemetry/otel-collector-config.yaml:/etc/otel-collector-config.yaml


  dcgm-exporter:
    profiles: [nvidia]
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.1.1-4.0.4-ubuntu22.04
    container_name: dcgm-exporter
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "9400:9400"  # Prometheus will scrape metrics from here
    command: ["dcgm-exporter"]
    networks:
      - dev
    labels:
      prometheus.scrape: "true"
      prometheus.port: "9400"
      prometheus.job: "dcgm-exporter"


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - dev
    ports:
      - "9090:9090"     # Prometheus web interface
    volumes:
      - ./tools/sre/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      # Docker service discovery for profile-dependent exporters (see prometheus.yml)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "${DOCKER_GID:?}"
    depends_on:
      - otel-collector
    labels:
      homepage.group: "Observability"
      homepage.name: "Prometheus"
      homepage.icon: "prometheus"
      homepage.href: "http://localhost:9090"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    networks:
      - dev
    volumes:
      - "./tools/sre/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml"
      - alertmanager-data:/data
    command: --config.file=/etc/alertmanager/alertmanager.yml --log.level=debug

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: jaeger
    networks:
      - dev
    command: ["--collector.otlp.enabled=true", "--collector.otlp.grpc.host-port=4320", "--collector.otlp.http.host-port=4321"]
    environment:
      - METRICS_STORAGE_TYPE=prometheus
      - PROMETHEUS_SERVER_URL=http://prometheus:9090
    ports:
      - "14268:14268"  # HTTP transport, applications or agents send trace data to this endpoint over HTTP
      - "14267:14267"  # gRPC transport, applications or agents send trace data to this endpoint over gRPC
      - "14399:14399"  # JAEGER_QUERY_PORT
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # Jaeger gRPC, used for gRPC communication within Jaeger's architecture
      - "5778:5778"    # Jaeger Admin
      - "44317:4320"   # Onboard Otel Collector gRPC port
      - "44318:4321"   # Onboard Otel Collector HTTP port
    depends_on:
      - otel-collector
      - prometheus
    labels:
      homepage.group: "Observability"
      homepage.name: "Jaeger"
      homepage.icon: "jaeger"
      homepage.href: "http://localhost:16686"


  # Logs: OTel SDK -> collector -> Loki (OTLP). Grafana queries it; trace_id links to Jaeger.
  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./tools/sre/loki/loki.yaml:/etc/loki/loki.yaml:ro
      # /loki is owned by the image's loki user, so the new volume inherits it
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - dev
    labels:
      homepage.group: "Observability"
      homepage.name: "Loki"
      homepage.icon: "loki"
      homepage.href: "http://localhost:3000/explore"

  # Elasticsearch service
  elasticsearch:
    profiles: [elk]  # optional: logs now go to Loki
    image: docker.elastic.co/elasticsearch/elasticsearch:8.7.0
    container_name: elasticsearch
    environment:
      - node.name=es01
      - cluster.name=logs-cluster
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?}
      - xpack.security.enabled=false
      # - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "9200:9200"  # HTTP
      - "9300:9300"  # Transport
    networks:
      - dev
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    depends_on:
      - otel-collector

  logstash:
    profiles: [elk]  # optional: logs now go to Loki
    image: docker.elastic.co/logstash/logstash:8.7.0
    container_name: logstash
    networks:
      - dev
    ports:
      - "5044:5045"    # Logstash Beats input
    deploy:
      resources:
        limits:
          memory: 512M
    # environment:
    #   - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    # command: >
    #   sh -c "/usr/local/bin/docker-entrypoint -Xms256m -Xmx256m"
    volumes:
      - ./tools/sre/logstash/logstash_config.conf:/usr/share/logstash/config/logstash.yml
      - ./tools/sre/logstash/logstash_pipeline.conf/:/usr/share/logstash/pipeline/pipeline.conf  # Pipeline configurations
    depends_on:
      - elasticsearch

  kibana:
    profiles: [elk]  # optional: logs now go to Loki
    image: docker.elastic.co/kibana/kibana:8.7.0
    container_name: kibana
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - kibana-data:/usr/share/kibana/data
    networks:
      - dev
    labels:
      homepage.group: "Observability"
      homepage.name: "Kibana"
      homepage.icon: "kibana"
      homepage.href: "http://localhost:5601"

  grafana:
    image: grafana/grafana:13.2.4
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?}  # Set the admin password
      # Grafana 13 bundles its datasources (Prometheus, Loki...) as plugins and updates them
      # on startup; a download cut short (bad connection) leaves them broken and every
      # dashboard empty. Keep the bundled versions; upgrade by bumping the image tag.
      - GF_PLUGINS_PREINSTALL_AUTO_UPDATE=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./tools/sre/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./tools/sre/grafana/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - dev
    depends_on:
      - otel-collector
      - prometheus
    labels:
      homepage.group: "Observability"
      homepage.name: "Grafana"
      homepage.icon: "grafana"
      homepage.href: "http://localhost:3000"

  # heimdall:
  #   image: linuxserver/heimdall:latest
  #   container_name: heimdall
  #   ports:
  #     - "8091:80"
  #   volumes:
  #     - heimdall-data:/config
  #   networks:
  #     - dev

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - 8092:3000
    volumes:
      - ./tools/sre/homepage:/app/config # Make sure your local config directory exists
      - /var/run/docker.sock:/var/run/docker.sock # (optional) For docker integrations
      - ./tools/sre/homepage/background:/app/public/images
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*" # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
    networks:
      - dev

  aiden:
    build:
      context: ./src/aiden
      dockerfile: Dockerfile
    image: intellectualplayspace/aiden
    container_name: AIden
    # The vault indexer embeds notes at startup: wait until the embeddings model is loaded
    depends_on:
      ovms-cpu-embed:
        condition: service_healthy
    environment:
      # Lets AIden report which profiles this machine runs (see /capabilities)
      - AIDEN_PROFILES=${COMPOSE_PROFILES:?}
      - OVMS_EMBED_MODEL_NAME=${OVMS_EMBED_MODEL_NAME:?}
      # The router's request classifier runs on the NPU model
      - OVMS_NPU_MODEL_NAME=${OVMS_NPU_MODEL_NAME:?}
      - AIDEN_SHOW_ROUTE=${AIDEN_SHOW_ROUTE:-true}
      - AIDEN_RECORD_EXPERIENCE=${AIDEN_RECORD_EXPERIENCE:-true}
      # Mentor: Claude via the mentor-bridge service (profile mentor); optional
      - MENTOR_URL=http://mentor-bridge:8765
      - MENTOR_TOKEN=${MENTOR_TOKEN:-}
      # Your ratings in OpenWebUI become experience too (see feedback.py); optional
      - OPENWEBUI_URL=http://ollama-webui:8080
      - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY:-}
    volumes:
      # The user's Obsidian vault, read-only: AIden indexes it for search (see vault.py)
      - ${VAULT_PATH:?}:/vault:ro
      # AIden's experience (prompts, decisions, answers): training data, local only
      - aiden-experience:/data/experience
    ports:
      # Localhost only: the API can read the vault. OpenWebUI reaches it over the dev network.
      - "127.0.0.1:8000:8000"
    networks:
      - dev
    labels:
      homepage.group: "Co-Pilot"
      homepage.name: "Aiden"
      homepage.icon: "docker"
      homepage.href: "http://localhost:8000"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: always
    networks:
      - dev
    labels:
      homepage.group: "Storage"
      homepage.name: "Qdrant"
      homepage.icon: "si-knowledgebase"
      homepage.href: "http://localhost:6333/dashboard"


  ollama:
    profiles: [nvidia]
    volumes:
      - ollama-data-gpu:/root/.ollama
    container_name: ollama
    tty: true
    restart: unless-stopped
    image: docker.io/ollama/ollama:latest
    ports:
      - 11434:11434
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    networks:
      - dev
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all 
              capabilities: [gpu]
    labels:
      homepage.group: "Machine Learning"
      homepage.name: "Ollama"
      homepage.icon: "si-ollama"
      homepage.href: "http://localhost:11434"

  # Same as ollama, without the NVIDIA GPU reservation (machines without an NVIDIA GPU)
  ollama-cpu:
    extends: ollama
    profiles: !override [cpu]
    deploy: !reset {}

  ollama-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ollama-webui
#    runtime: nvidia
    volumes:
      - ollama-data-webui:/app/backend/data
    depends_on:
      ollama:
        condition: service_started
        required: false
      ollama-cpu:
        condition: service_started
        required: false
    ports:
      - 8080:8080
    environment:
      - OLLAMA_BASE_URLS=http://host.docker.internal:11434
      - ENV=dev
      - WEBUI_AUTH=False
      - WEBUI_NAME=valiantlynx AI
      - WEBUI_URL=http://localhost:8080
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?}
      # .env is the source of truth: without this, settings saved on first start
      # override env changes (e.g. adding a backend later)
      - ENABLE_PERSISTENT_CONFIG=False
      # Model for background tasks (titles, tags, follow-ups) while chatting with AIden;
      # empty = AIden itself, which passes them through cleanly (see chat_api.py)
      - TASK_MODEL_EXTERNAL=${OPENWEBUI_TASK_MODEL:-}
      # Extra OpenAI-compatible backends (e.g. OVMS on the NPU); may be empty
      - OPENAI_API_BASE_URLS=${OPENWEBUI_OPENAI_API_BASE_URLS?}
      - OPENAI_API_KEYS=${OPENWEBUI_OPENAI_API_KEYS?}
#      - RAG_EMBEDDING_MODEL_DEVICE_TYPE=cuda
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    networks:
      - dev
    labels:
      homepage.group: "Machine Learning"
      homepage.name: "OpenWebUI"
      homepage.icon: "si-openai"
      homepage.href: "http://localhost:8080"

  # LLM serving on the Intel NPU (OpenAI-compatible API at /v3). The first start
  # downloads the model and compiles it for the NPU, which takes several minutes;
  # the compiled blob is cached in the volume.
  ovms-npu:
    profiles: [npu]
    image: openvino/model_server:2026.4.1-gpu  # -gpu images include the NPU driver
    container_name: ovms-npu
    restart: unless-stopped
    command: >
      --source_model ${OVMS_NPU_MODEL:?}
      --model_name ${OVMS_NPU_MODEL_NAME:?}
      --model_repository_path /home/ovms/models
      --cache_dir /home/ovms/models/.ov_cache
      --target_device NPU
      --task text_generation
      --max_prompt_len 2000
      --rest_port 8001
      --metrics_enable
      --metrics_list ovms_requests_accepted,ovms_requests_rejected,ovms_responses,ovms_current_graphs,ovms_graph_error,ovms_graph_processing_time_us
    devices:
      - /dev/accel:/dev/accel
    group_add:
      - "${RENDER_GID:?}"
    volumes:
      # Mounted on the ovms user's home so the new volume inherits its ownership
      - ovms-data:/home/ovms
    ports:
      - "8001:8001"
    networks:
      - dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30m
    labels:
      homepage.group: "Machine Learning"
      homepage.name: "OVMS (NPU)"
      homepage.icon: "si-intel"
      homepage.href: "http://localhost:8001/v3/models"
      prometheus.scrape: "true"
      prometheus.port: "8001"
      prometheus.job: "ovms-npu"

  # AIden's mentor: Claude via the Claude Code CLI, asked only for questions without the
  # user's notes. Auth is a long-lived subscription token (claude setup-token) from .env;
  # the host's ~/.claude is never mounted. No published port: only AIden calls it.
  mentor-bridge:
    profiles: [mentor]
    build:
      context: ./tools/mentor-bridge
    image: intellectualplayspace/mentor-bridge:claude-code-2.1.296
    pull_policy: build
    container_name: mentor-bridge
    restart: unless-stopped
    environment:
      - MENTOR_TOKEN=${MENTOR_TOKEN:?}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - MENTOR_MAX_PER_HOUR=${MENTOR_MAX_PER_HOUR:-10}
      - MENTOR_MODEL=${MENTOR_MODEL:-}
    read_only: true
    tmpfs:
      - /tmp
      - /home/mentor
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      - dev

  # Text embeddings for vault search and indexing (OpenAI-compatible /v3/embeddings).
  # Short queries take ~35 ms on CPU (vs ~1 s on the NPU, which pads every input to
  # max_length). A separate NPU copy for bulk indexing was removed (2 GiB of RAM for a
  # job that's done once): indexing now uses this service too. vault.py still prefers an
  # ovms-embed-index service if one is ever added back.
  ovms-cpu-embed:
    image: openvino/model_server:2026.4.1-gpu
    container_name: ovms-cpu-embed
    restart: unless-stopped
    command: >
      --source_model ${OVMS_EMBED_MODEL:?}
      --model_name ${OVMS_EMBED_MODEL_NAME:?}
      --model_repository_path /home/ovms/models
      --cache_dir /home/ovms/models/.ov_cache
      --target_device CPU
      --task embeddings
      --pooling LAST
      --rest_port 8003
    volumes:
      - ovms-data:/home/ovms
    networks:
      dev:
        aliases: [ovms-embed-query]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30m

  # LLM serving on an Intel GPU (Arc / iGPU), same image as ovms-npu. OpenAI-compatible
  # API at /v3. Shares the ovms-data volume (model downloads and compile cache).
  ovms-gpu:
    profiles: [intel-gpu]
    image: openvino/model_server:2026.4.1-gpu
    container_name: ovms-gpu
    restart: unless-stopped
    command: >
      --source_model ${OVMS_GPU_MODEL:?}
      --model_name ${OVMS_GPU_MODEL_NAME:?}
      --model_repository_path /home/ovms/models
      --cache_dir /home/ovms/models/.ov_cache
      --target_device GPU
      --task text_generation
      --rest_port 8002
      --metrics_enable
      --metrics_list ovms_requests_accepted,ovms_requests_rejected,ovms_responses,ovms_current_graphs,ovms_graph_error,ovms_graph_processing_time_us
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:?}"
    volumes:
      - ovms-data:/home/ovms
    ports:
      - "8002:8002"
    networks:
      - dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30m
    labels:
      homepage.group: "Machine Learning"
      homepage.name: "OVMS (Intel GPU)"
      homepage.icon: "si-intel"
      homepage.href: "http://localhost:8002/v3/models"
      prometheus.scrape: "true"
      prometheus.port: "8002"
      prometheus.job: "ovms-gpu"

  # NPU and Intel GPU telemetry from sysfs; runs when either Intel profile is active
  intel-exporter:
    profiles: [npu, intel-gpu]
    image: python:3.12.7-slim
    container_name: intel-exporter
    restart: unless-stopped
    command: ["python", "/app/intel_exporter.py"]
    volumes:
      - ./tools/sre/intel-exporter/intel_exporter.py:/app/intel_exporter.py:ro
      - /sys:/host/sys:ro
    networks:
      - dev
    labels:
      prometheus.scrape: "true"
      prometheus.port: "9101"
      prometheus.job: "intel-exporter"

  # MLFlow Tracking Server to track experiments for ML
  mlflow:
    restart: always
    build:
      context: .
      dockerfile: ./tools/mlops/mlflow/Dockerfile
    image: intellectualplayspace/mlflow  # Use the custom image name here
    container_name: mlflow
    depends_on:
      - postgres
      - minio
    ports:
      - "5000:5000"
    networks:
      - dev
    environment:
      - AWS_ACCESS_KEY_ID=${MLFLOW_S3_ACCESS_KEY:?}
      - AWS_SECRET_ACCESS_KEY=${MLFLOW_S3_SECRET_KEY:?}
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_TLS=true
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/postgres
      --host 0.0.0.0
      --serve-artifacts
      --artifacts-destination s3://mlflow
    healthcheck:
      # The MLflow image has no curl; use its Python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      homepage.group: "Machine Learning"
      homepage.name: "MLFlow"
      homepage.icon: "si-mlflow"
      homepage.href: "http://localhost:5000"


  postgres:
    restart: always
    image: postgres:17  # 18+ expects the volume at /var/lib/postgresql; keep 17 for existing data
    container_name: postgresql
    networks:
      - dev
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DATABASE=mlflow
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD", "pg_isready", "-p", "5432", "-U", "${POSTGRES_USER:?}"]
      interval: 5s
      timeout: 5s
      retries: 3
    labels:
      homepage.group: "Storage"
      homepage.name: "PostgreSQL"
      homepage.icon: "postgres"
      homepage.href: "http://localhost:5432"

  # S3 storage for MLFlow
  minio:
    restart: always
    # Built from source: upstream no longer publishes public images
    build:
      context: ./tools/mlops/minio
      target: minio
    image: intellectualplayspace/minio:RELEASE.2025-04-22T22-12-26Z #LAST VERSION BEFORE THEY RUINED MINIO, DON'T CHANGE
    pull_policy: build
    container_name: minio
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - dev
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?}
      - MINIO_ADDRESS=:9000
      - MINIO_PORT=9000
      - MINIO_STORAGE_USE_HTTPS=False
      - MINIO_CONSOLE_ADDRESS=:9001
      - MINIO_PROMETHEUS_AUTH_TYPE=public
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    labels:
      homepage.group: "Storage"
      homepage.name: "MinIO"
      homepage.icon: "minio"
      homepage.href: "http://localhost:9001"


  minio_init:
    container_name: minio_init_container
    build:
      context: ./tools/mlops/minio
      target: mc
    image: intellectualplayspace/mc:RELEASE.2025-04-16T18-13-26Z
    pull_policy: build
    depends_on:
      - minio
    networks:
      - dev
    entrypoint: >
      /bin/sh -c "
      sleep 30s;
      /usr/bin/mc alias set s3minio http://minio:9000 ${MINIO_ROOT_USER:?} ${MINIO_ROOT_PASSWORD:?};
      /usr/bin/mc admin user svcacct add --access-key "${MLFLOW_S3_ACCESS_KEY:?}" --secret-key "${MLFLOW_S3_SECRET_KEY:?}" --name mlflow --description connection s3minio ${MINIO_ROOT_USER:?};
      /usr/bin/mc mb s3minio/mlflow;
      /usr/bin/mc policy set public s3minio/mlflow;
      exit 0;
      "

networks:
  dev:

volumes:
  grafana-data:
  elastic-data:
  kibana-data:
  # heimdall-data:
  alertmanager-data:
  minio-data:
  postgres-data:
  ollama-data-gpu:
  ollama-data-webui:
  qdrant-data:
  ovms-data:
  loki-data:
  aiden-experience:
