# prometheus.yml
global:
  scrape_interval: 15s  # How often to scrape metrics from targets
  evaluation_interval: 15s  # How often to evaluate rules

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']

  - job_name: 'minio'
    metrics_path: '/minio/v2/metrics/cluster'
    static_configs:
      - targets: ['minio:9000']

  # Profile-dependent exporters (e.g. dcgm-exporter in the nvidia profile) are
  # discovered from Docker, so they appear and disappear with the active profiles.
  # Opt in with container labels:
  #   prometheus.scrape: "true"
  #   prometheus.port:   "<metrics port>"
  #   prometheus.job:    "<job name>"
  - job_name: 'docker'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ['prometheus.scrape=true']
    relabel_configs:
      - source_labels: [__meta_docker_network_ip, __meta_docker_container_label_prometheus_port]
        separator: ':'
        target_label: __address__
      - source_labels: [__meta_docker_container_label_prometheus_job]
        target_label: job

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets: [ 'alertmanager:9093' ]