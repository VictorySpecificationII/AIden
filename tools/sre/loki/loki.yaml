# Single-node Loki for AIden's logs: filesystem storage in the loki-data volume,
# OTLP ingestion (the collector sends to http://loki:3100/otlp), 30-day retention.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # OTLP log attributes (trace_id, span_id, code location, ...) are kept as structured metadata
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 720h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
